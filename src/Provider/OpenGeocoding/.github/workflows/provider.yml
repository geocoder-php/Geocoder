name: Provider

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    name: PHP ${{ matrix.php-version }} (${{ matrix.deps }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.0', '8.1', '8.2', '8.3', '8.4', '8.5']
        deps: ['high']
        include:
          - php-version: '8.0'
            deps: 'low'
    steps:
    - uses: actions/checkout@v7
    - name: Use PHP ${{ matrix.php-version }}
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php-version }}
        extensions: curl
    - name: Validate composer.json
      run: composer validate --strict
    - name: Install dependencies
      if: ${{ matrix.deps == 'high' }}
      run: composer update --prefer-stable --prefer-dist --no-progress
    - name: Install dependencies (lowest)
      if: ${{ matrix.deps == 'low' }}
      run: composer update --prefer-lowest --prefer-stable --prefer-dist --no-progress
    - name: Run test suite
      run: composer run-script test
